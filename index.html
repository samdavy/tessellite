<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140a26">
<title>Tessellite — gem block puzzle</title>
<style>
  :root{
    --cell:40px; --gap:3px; --pad:8px; --mini:14px; --mgap:1px;
    --bg1:#2a1247; --bg2:#0c0718; --board:#110a20; --slot:#221637; --ink:#f4ecff; --muted:#a995c9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%,var(--bg1) 0%,#170b2c 45%,var(--bg2) 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  /* starfield sparkle */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 78% 12%,#fff9,transparent),
    radial-gradient(1.2px 1.2px at 40% 72%,#fff6,transparent),radial-gradient(1px 1px at 88% 64%,#fff8,transparent),
    radial-gradient(1.4px 1.4px at 22% 88%,#fff7,transparent),radial-gradient(1px 1px at 60% 35%,#fff5,transparent)}
  #app{display:flex;flex-direction:column;align-items:center;gap:calc(var(--cell)*.3);position:relative}
  header{width:var(--bw);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .logo{font-weight:900;letter-spacing:.06em;font-size:calc(var(--cell)*.52);line-height:1;
    background:linear-gradient(90deg,#2ee59d,#22d3ee 30%,#b061ff 65%,#ff6ad5);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #0008)}
  .logo small{display:block;font-size:.38em;letter-spacing:.25em;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:700;margin-top:3px}
  .scores{display:flex;gap:6px;align-items:stretch}
  .sc{background:#ffffff10;border:1px solid #ffffff1a;border-radius:10px;padding:4px 10px;text-align:center;min-width:calc(var(--cell)*1.7)}
  .sc b{display:block;font-size:calc(var(--cell)*.42);font-variant-numeric:tabular-nums}
  .sc span{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:700}
  .sc.best b{color:#ffcf5a}
  .iconbtn{background:#ffffff14;border:1px solid #ffffff22;color:var(--ink);border-radius:10px;width:calc(var(--cell)*.95);font-size:calc(var(--cell)*.45);cursor:pointer}
  .bump{animation:bump .3s}
  @keyframes bump{40%{transform:scale(1.15)}}

  #boardWrap{position:relative}
  #board{position:relative;display:grid;grid-template-columns:repeat(8,var(--cell));grid-auto-rows:var(--cell);gap:var(--gap);padding:var(--pad);
    background:var(--board);border-radius:14px;
    box-shadow:0 0 0 2px #3b2763,0 0 0 5px #1a1030,0 18px 40px #0009,inset 0 0 30px #000a}
  .cell{border-radius:22%;background:#1c1231;box-shadow:inset 0 2px 4px #0008,inset 0 -1px 0 #ffffff08;position:relative}
  .gem{
    background:linear-gradient(145deg,color-mix(in srgb,var(--c) 45%,white) 0%,var(--c) 38%,var(--c) 62%,color-mix(in srgb,var(--c) 62%,black) 100%);
    box-shadow:inset 0 0 0 1px #ffffff30,inset calc(var(--s,1)*3px) calc(var(--s,1)*3px) 0 #ffffff45,inset calc(var(--s,1)*-3px) calc(var(--s,1)*-3px) 0 #00000040,0 2px 3px #0006;
  }
  .gem::after{content:"";position:absolute;left:18%;top:16%;width:26%;height:16%;border-radius:50%;background:#ffffffb0;transform:rotate(-30deg);filter:blur(.3px)}
  .cell.ghost{opacity:.42}
  .cell.hot{filter:brightness(1.25) saturate(1.2);box-shadow:inset 0 0 0 2px #fff9,0 0 10px var(--c)}
  .cell.blastzone{outline:2px dashed #ffd36b;outline-offset:-2px}
  .cell.clearing{animation:shatter .38s ease-in forwards;z-index:2}
  @keyframes shatter{0%{transform:scale(1);filter:brightness(2.2)}40%{transform:scale(1.18) rotate(8deg);filter:brightness(2.6)}100%{transform:scale(0) rotate(45deg);opacity:0}}
  .bomb{
    background:radial-gradient(circle at 50% 50%,#fff 0 10%,#ffe08a 18%,#ff8a3d 40%,#c2185b 70%,#3a0a24 100%) !important;
    box-shadow:0 0 12px #ff8a3d,inset 0 0 0 2px #ffffff60 !important;animation:pulse 1s infinite alternate}
  .bomb::after{display:none}
  @keyframes pulse{to{filter:brightness(1.35)}}

  #tray{width:var(--bw);display:flex;gap:calc(var(--cell)*.18);align-items:stretch}
  .slot{flex:1;height:var(--slotH);display:flex;align-items:center;justify-content:center;border-radius:14px;position:relative;cursor:grab;touch-action:none}
  .slot.tray{background:#ffffff07}
  .slot.hold{flex:0 0 var(--holdW);background:linear-gradient(#2c1b4a,#1d1233);border:2px dashed #6e55a3;cursor:grab}
  .slot.hold::before{content:"VAULT";position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.25em;color:var(--muted);font-weight:800}
  .slot.hold.over{border-color:#2ee59d;background:#2ee59d22}
  .slot.dim .mini{opacity:.32;filter:grayscale(.7)}
  .mini{display:grid;gap:var(--mgap);pointer-events:none}
  .mini .cell,.float .cell{border-radius:22%}
  .mini .gem{--s:.5}
  .mini .empty,.float .empty{background:transparent;box-shadow:none}
  .float{position:fixed;left:0;top:0;display:grid;gap:var(--gap);pointer-events:none;z-index:50;filter:drop-shadow(0 10px 12px #000a);will-change:transform}
  .float.back{transition:transform .2s ease-out,opacity .2s}

  .pop{position:absolute;pointer-events:none;font-weight:900;white-space:nowrap;transform:translate(-50%,-50%);z-index:20;
    text-shadow:0 3px 0 #0008,0 0 12px #000;animation:pop 1.1s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
  #streak{width:var(--bw);height:6px;border-radius:3px;background:#ffffff12;overflow:hidden;margin-top:-4px}
  #streak i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb627,#ff4d6d);transition:width .3s}
  #hint{font-size:11px;color:var(--muted);text-align:center;max-width:var(--bw);letter-spacing:.03em}

  #over{position:fixed;inset:0;background:#07031099;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}
  #over.show{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}}
  .card{background:linear-gradient(#2a1a48,#170d2b);border:1px solid #ffffff22;border-radius:20px;padding:26px 34px;text-align:center;box-shadow:0 20px 60px #000c;min-width:240px}
  .card h2{margin:0 0 6px;font-size:28px;letter-spacing:.08em;color:#ff6ad5}
  .card .big{font-size:48px;font-weight:900;font-variant-numeric:tabular-nums}
  .card .nb{color:#ffcf5a;font-weight:800;letter-spacing:.1em;min-height:1.2em}
  .card button{margin-top:14px;font:inherit;font-weight:800;font-size:18px;letter-spacing:.08em;color:#120a20;border:0;border-radius:14px;padding:12px 30px;cursor:pointer;
    background:linear-gradient(#5dffc0,#20c987);box-shadow:0 5px 0 #0f7a52,0 8px 18px #0007}
  .card button:active{transform:translateY(3px);box-shadow:0 2px 0 #0f7a52}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">TESSELLITE<small>GEM BLOCK PUZZLE</small></div>
    <div class="scores">
      <div class="sc"><span>SCORE</span><b id="score">0</b></div>
      <div class="sc best"><span>BEST</span><b id="best">0</b></div>
      <button class="iconbtn" id="restartBtn" title="Restart (R)" aria-label="Restart">↻</button>
    </div>
  </header>
  <div id="boardWrap"><div id="board"></div></div>
  <div id="streak" title="Combo streak: clear again before it drains"><i></i></div>
  <div id="tray">
    <div class="slot hold" id="hold" data-src="hold"></div>
    <div class="slot tray" data-src="0"></div>
    <div class="slot tray" data-src="1"></div>
    <div class="slot tray" data-src="2"></div>
  </div>
  <div id="hint">Drag gems onto the board. Fill rows/columns to shatter them. Drop a piece on the VAULT to stash it. ✸ Nova shards blast a 3×3 area.</div>
</div>
<div id="over"><div class="card">
  <h2>NO MOVES</h2><div style="color:var(--muted);font-size:12px;letter-spacing:.2em">SCORE</div>
  <div class="big" id="finalScore">0</div><div class="nb" id="newBest"></div>
  <div style="color:var(--muted);font-size:13px">Best: <b id="finalBest">0</b></div>
  <button id="againBtn">PLAY AGAIN</button>
</div></div>

<script id="logic">
/* ===== Pure game logic (no DOM) — exposed as window.TS ===== */
(function(root){
  const N = 8;
  const GRACE = 3;            // placements without a clear before combo breaks
  const BOMB_CHANCE = 0.06;   // per dealt piece (max one per deal)
  const COLORS = ['#ff4d6d','#ffb627','#2ee59d','#3d8bff','#b061ff','#22d3ee','#ff7a45','#ff6ad5'];
  const DEFS = [
    // [rows, weight]
    [['X'],2],
    [['XX'],3],[['X','X'],3],
    [['XXX'],3],[['X','X','X'],3],
    [['XXXX'],2],[['X','X','X','X'],2],
    [['XXXXX'],1.4],[['X','X','X','X','X'],1.4],
    [['XX','XX'],3],
    [['XXX','XXX','XXX'],1],
    [['XXX','XXX'],1],[['XX','XX','XX'],1],
    // small corners
    [['XX','X.'],2],[['XX','.X'],2],[['X.','XX'],2],[['.X','XX'],2],
    // L
    [['X.','X.','XX'],1],[['XXX','X..'],1],[['XX','.X','.X'],1],[['..X','XXX'],1],
    // J
    [['.X','.X','XX'],1],[['X..','XXX'],1],[['XX','X.','X.'],1],[['XXX','..X'],1],
    // big corners
    [['X..','X..','XXX'],.8],[['XXX','X..','X..'],.8],[['XXX','..X','..X'],.8],[['..X','..X','XXX'],.8],
    // T
    [['XXX','.X.'],1],[['.X.','XXX'],1],[['X.','XX','X.'],1],[['.X','XX','.X'],1],
    // S / Z
    [['.XX','XX.'],1],[['XX.','.XX'],1],[['X.','XX','.X'],1],[['.X','XX','X.'],1],
  ];
  function parse(rows){
    const cells=[];
    rows.forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==='X') cells.push([r,c]); }));
    return {cells, h:rows.length, w:Math.max(...rows.map(r=>r.length))};
  }
  const SHAPES = DEFS.map(([rows,w])=>Object.assign(parse(rows),{weight:w,key:rows.join('/')}));
  const TOTALW = SHAPES.reduce((s,x)=>s+x.weight,0);

  function emptyBoard(){ return Array.from({length:N},()=>Array(N).fill(null)); }
  function cloneBoard(b){ return b.map(r=>r.slice()); }

  function makePiece(shape,color,bomb){
    return {cells:shape.cells, w:shape.w, h:shape.h, color, bomb:!!bomb, key:bomb?'bomb':shape.key};
  }
  function bombPiece(){ return makePiece({cells:[[0,0]],w:1,h:1},'#ff8a3d',true); }
  function randomShape(rng){
    let x=rng()*TOTALW;
    for(const s of SHAPES){ x-=s.weight; if(x<0) return s; }
    return SHAPES[SHAPES.length-1];
  }
  function canPlace(board,piece,r,c){
    for(const [dr,dc] of piece.cells){
      const rr=r+dr, cc=c+dc;
      if(rr<0||cc<0||rr>=N||cc>=N||board[rr][cc]!==null) return false;
    }
    return true;
  }
  function fitsAnywhere(board,piece){
    for(let r=0;r<=N-piece.h;r++) for(let c=0;c<=N-piece.w;c++) if(canPlace(board,piece,r,c)) return true;
    return false;
  }
  // Simulate a placement. Returns null if invalid.
  function simulate(board,piece,r,c){
    if(!canPlace(board,piece,r,c)) return null;
    const b=cloneBoard(board);
    for(const [dr,dc] of piece.cells) b[r+dr][c+dc]=piece.bomb?'bomb':piece.color;
    const rows=[],cols=[];
    for(let i=0;i<N;i++){
      if(b[i].every(v=>v!==null)) rows.push(i);
      let full=true; for(let j=0;j<N;j++) if(b[j][i]===null){full=false;break;}
      if(full) cols.push(i);
    }
    const set=new Map(); // "r,c" -> color
    const add=(rr,cc)=>{ if(b[rr][cc]!==null) set.set(rr+','+cc,b[rr][cc]); };
    rows.forEach(i=>{for(let j=0;j<N;j++) add(i,j);});
    cols.forEach(j=>{for(let i=0;i<N;i++) add(i,j);});
    const blast=[];
    if(piece.bomb){
      for(let rr=r-1;rr<=r+1;rr++) for(let cc=c-1;cc<=c+1;cc++)
        if(rr>=0&&cc>=0&&rr<N&&cc<N){ blast.push([rr,cc]); add(rr,cc); }
    }
    const cleared=[...set].map(([k,col])=>{const [a,bb]=k.split(',').map(Number);return [a,bb,col];});
    // blast-only cells (excluding bomb itself)
    const lineKeys=new Set(); rows.forEach(i=>{for(let j=0;j<N;j++) lineKeys.add(i+','+j);}); cols.forEach(j=>{for(let i=0;i<N;i++) lineKeys.add(i+','+j);});
    const blastOnly=cleared.filter(([a,bb])=>!lineKeys.has(a+','+bb) && !(a===r&&bb===c)).length;
    for(const [a,bb] of cleared) b[a][bb]=null;
    return {board:b, rows, cols, lines:rows.length+cols.length, cleared, blast, blastOnly};
  }

  class Game{
    constructor(rng){ this.rng=rng||Math.random; this.reset(); }
    reset(){
      this.board=emptyBoard(); this.tray=[null,null,null]; this.hold=null;
      this.score=0; this.combo=0; this.miss=0; this.over=false; this.moves=0;
      this.deal();
    }
    deal(){
      const rng=this.rng;
      let best=null;
      for(let attempt=0;attempt<25;attempt++){
        const used=new Set(); const pieces=[]; let bombUsed=false;
        for(let i=0;i<3;i++){
          if(!bombUsed && this.moves>2 && rng()<BOMB_CHANCE){ pieces.push(bombPiece()); bombUsed=true; continue; }
          const free=COLORS.filter(x=>!used.has(x)); const color=free[Math.floor(rng()*free.length)%free.length]; used.add(color);
          pieces.push(makePiece(randomShape(rng),color,false));
        }
        best=pieces;
        if(pieces.some(p=>fitsAnywhere(this.board,p))) break;   // fairness: at least one fits if possible
      }
      this.tray=best;
    }
    pieceAt(src){ return src==='hold'?this.hold:this.tray[src]; }
    available(){ return [...this.tray,this.hold].filter(Boolean); }
    checkOver(){ this.over = !this.available().some(p=>fitsAnywhere(this.board,p)); return this.over; }
    // stash tray piece i into hold (swap if hold occupied)
    stash(i){
      if(this.over || !this.tray[i]) return false;
      const t=this.hold; this.hold=this.tray[i]; this.tray[i]=t;
      if(this.tray.every(p=>!p)) this.deal();
      this.checkOver();
      return true;
    }
    place(src,r,c){
      if(this.over) return null;
      const piece=this.pieceAt(src); if(!piece) return null;
      const sim=simulate(this.board,piece,r,c); if(!sim) return null;
      this.board=sim.board; this.moves++;
      if(src==='hold') this.hold=null; else this.tray[src]=null;
      const n=sim.lines;
      const didClear = n>0 || sim.blastOnly>0;
      let pts=piece.cells.length, bonus=0;
      if(didClear){ this.combo+=1; this.miss=0; } else { this.miss++; if(this.miss>=GRACE) this.combo=0; }
      if(n>0) bonus += 10*N*n + (n>1 ? 40*n*(n-1) : 0);
      bonus += sim.blastOnly*6;
      const mult = Math.max(1,this.combo);
      bonus *= mult;
      const perfect = didClear && this.board.every(row=>row.every(v=>v===null));
      if(perfect) bonus += 300;
      pts += bonus;
      this.score += pts;
      let dealt=false;
      if(this.tray.every(p=>!p)){ this.deal(); dealt=true; }
      this.checkOver();
      return {points:pts, lines:n, combo:this.combo, mult, cleared:sim.cleared, rows:sim.rows, cols:sim.cols, blast:sim.blast, bomb:piece.bomb, perfect, dealt, r, c, piece};
    }
  }
  root.TS={N,GRACE,COLORS,SHAPES,emptyBoard,cloneBoard,makePiece,bombPiece,canPlace,fitsAnywhere,simulate,Game};
})(typeof window!=='undefined'?window:globalThis);
</script>

<script>
/* ===== UI ===== */
(function(){
  const {N,simulate,Game} = TS;
  const $=s=>document.querySelector(s);
  const boardEl=$('#board'), wrap=$('#boardWrap'), holdEl=$('#hold');
  const slots=[...document.querySelectorAll('.slot')];
  const LS='tessellite.best';
  let best=+(localStorage.getItem(LS)||0);
  const game=new Game();
  window.__game=game;
  let clearing=new Map();  // "r,c" -> color (animating)
  let drag=null;
  let lastScore=0;

  // build board cells
  const cellEls=[];
  for(let r=0;r<N;r++){ cellEls.push([]); for(let c=0;c<N;c++){ const d=document.createElement('div'); d.className='cell'; boardEl.appendChild(d); cellEls[r].push(d);} }

  let CELL=40,GAP=3,PAD=8;
  function layout(){
    const vw=Math.min(window.innerWidth,620), vh=window.innerHeight;
    CELL=Math.floor(Math.max(22,Math.min(64,(vw*0.94)/8.75,(vh-24)/14.2)));
    GAP=Math.max(2,Math.round(CELL*0.07)); PAD=Math.round(CELL*0.2);
    const bw=CELL*8+GAP*7+PAD*2;
    const st=document.documentElement.style;
    st.setProperty('--cell',CELL+'px'); st.setProperty('--gap',GAP+'px'); st.setProperty('--pad',PAD+'px');
    st.setProperty('--bw',bw+'px');
    const slotW=(bw-CELL*0.18*3)/4;
    st.setProperty('--holdW',slotW+'px');
    st.setProperty('--slotH',Math.round(Math.min(slotW,CELL*2.6))+'px');
    const mini=Math.floor(Math.min((slotW-12)/5, CELL*0.42));
    st.setProperty('--mini',mini+'px');
    renderTray();
  }

  function paintGem(el,color){
    if(color==='bomb'){ el.className='cell gem bomb'; el.style.removeProperty('--c'); }
    else { el.className='cell gem'; el.style.setProperty('--c',color); }
  }
  function render(preview){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const el=cellEls[r][c], v=game.board[r][c], k=r+','+c;
      if(clearing.has(k)){ paintGem(el,clearing.get(k)); el.classList.add('clearing'); continue; }
      if(v!==null) paintGem(el,v); else { el.className='cell'; el.style.removeProperty('--c'); }
    }
    if(preview){
      const {piece,r,c,sim}=preview;
      const col=piece.bomb?'bomb':piece.color;
      for(const [dr,dc] of piece.cells){ const el=cellEls[r+dr][c+dc]; paintGem(el,col); el.classList.add('ghost'); }
      for(const [a,b] of sim.cleared){ const el=cellEls[a][b]; if(el.classList.contains('ghost')) continue;
        if(!piece.bomb){ paintGem(el,piece.color); el.classList.add('hot'); } else el.classList.add('hot'); }
      if(piece.bomb) for(const [a,b] of sim.blast) cellEls[a][b].classList.add('blastzone');
    }
  }
  function miniGrid(piece,size,gap){
    const g=document.createElement('div');
    g.style.gridTemplateColumns=`repeat(${piece.w},${size})`; g.style.gridAutoRows=size; g.style.gap=gap;
    const filled=new Set(piece.cells.map(([r,c])=>r+','+c));
    for(let r=0;r<piece.h;r++) for(let c=0;c<piece.w;c++){
      const d=document.createElement('div');
      if(filled.has(r+','+c)) paintGem(d,piece.bomb?'bomb':piece.color); else d.className='cell empty';
      g.appendChild(d);
    }
    return g;
  }
  function renderTray(){
    slots.forEach(s=>{
      s.innerHTML='';
      const src=s.dataset.src==='hold'?'hold':+s.dataset.src;
      const p=game.pieceAt(src);
      s.classList.toggle('dim', !!p && !TS.fitsAnywhere(game.board,p));
      if(!p) return;
      const g=miniGrid(p,'var(--mini)','var(--mgap)'); g.className='mini';
      if(drag && drag.src===src) g.style.visibility='hidden';
      s.appendChild(g);
    });
  }
  function updateScore(){
    $('#score').textContent=game.score;
    if(game.score>best){ best=game.score; localStorage.setItem(LS,best); }
    $('#best').textContent=best;
    if(game.score!==lastScore){ const e=$('#score'); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); lastScore=game.score; }
    const pct = game.combo>0 ? (1-game.miss/TS.GRACE)*100 : 0;
    $('#streak i').style.width=pct+'%';
  }
  function popup(text,x,y,color,size){
    const d=document.createElement('div'); d.className='pop'; d.textContent=text;
    d.style.left=x+'px'; d.style.top=y+'px'; d.style.color=color||'#fff'; d.style.fontSize=(size||CELL*0.6)+'px';
    wrap.appendChild(d); setTimeout(()=>d.remove(),1150);
  }
  function cellCenter(r,c){ return [PAD+c*(CELL+GAP)+CELL/2, PAD+r*(CELL+GAP)+CELL/2]; }

  // ---- drag & drop ----
  function startDrag(e){
    if(game.over || drag) return;
    const s=e.currentTarget; const src=s.dataset.src==='hold'?'hold':+s.dataset.src;
    const piece=game.pieceAt(src); if(!piece) return;
    e.preventDefault();
    const fl=miniGrid(piece,CELL+'px',GAP+'px'); fl.className='float';
    document.body.appendChild(fl);
    const touch=e.pointerType!=='mouse';
    const pw=piece.w*CELL+(piece.w-1)*GAP, ph=piece.h*CELL+(piece.h-1)*GAP;
    drag={src,piece,el:fl,id:e.pointerId,pw,ph,dx:pw/2,dy: touch? ph+CELL*1.1 : ph/2, slot:s, target:null, overHold:false};
    renderTray();
    moveDrag(e);
  }
  function moveDrag(e){
    if(!drag||e.pointerId!==drag.id) return;
    const x=e.clientX-drag.dx, y=e.clientY-drag.dy;
    drag.el.style.transform=`translate(${x}px,${y}px)`;
    const br=boardEl.getBoundingClientRect();
    const pitch=CELL+GAP;
    const c=Math.round((x-br.left-PAD)/pitch), r=Math.round((y-br.top-PAD)/pitch);
    const hr=holdEl.getBoundingClientRect();
    drag.overHold = drag.src!=='hold' && e.clientX>=hr.left&&e.clientX<=hr.right&&e.clientY>=hr.top-CELL*0.5&&e.clientY<=hr.bottom+CELL;
    holdEl.classList.toggle('over',drag.overHold);
    const sim = drag.overHold?null:simulate(game.board,drag.piece,r,c);
    drag.target = sim?{r,c,sim}:null;
    render(sim?{piece:drag.piece,r,c,sim}:null);
  }
  function endDrag(e,cancel){
    if(!drag||e.pointerId!==drag.id) return;
    if(!cancel) moveDrag(e);   // use final pointer position
    const d=drag; holdEl.classList.remove('over');
    if(!cancel && d.overHold){
      d.el.remove(); drag=null; game.stash(d.src); afterMove(); return;
    }
    if(!cancel && d.target){
      d.el.remove(); drag=null;
      const res=game.place(d.src,d.target.r,d.target.c);
      if(res) celebrate(res);
      afterMove(); return;
    }
    // return to tray
    const sr=d.slot.getBoundingClientRect();
    d.el.classList.add('back');
    d.el.style.transform=`translate(${sr.left+sr.width/2-d.pw/2}px,${sr.top+sr.height/2-d.ph/2}px) scale(.4)`;
    d.el.style.opacity='0';
    drag=null; render(); setTimeout(()=>{ d.el.remove(); renderTray(); },200);
  }
  function celebrate(res){
    if(res.cleared.length){
      res.cleared.forEach(([r,c,col])=>clearing.set(r+','+c,col));
      setTimeout(()=>{ res.cleared.forEach(([r,c])=>clearing.delete(r+','+c)); render(); },400);
    }
    const [cx,cy]=cellCenter(res.r+((res.piece.h-1)/2),res.c+((res.piece.w-1)/2));
    popup('+'+res.points,cx,cy,'#fff',CELL*(res.lines?0.7:0.45));
    const mid=(PAD*2+CELL*8+GAP*7)/2;
    if(res.bomb) popup('NOVA!',mid,mid-CELL*1.2,'#ffb627',CELL*0.9);
    if(res.lines>=2) popup(['','','DOUBLE!','TRIPLE!','QUAD!','MEGA!'][Math.min(res.lines,5)]||'MEGA!',mid,mid-CELL*0.4,'#22d3ee',CELL*0.85);
    else if(res.lines===1) popup(['Nice!','Sweet!','Crisp!','Sharp!'][Math.floor(Math.random()*4)],mid,mid-CELL*0.4,'#2ee59d',CELL*0.7);
    if(res.mult>1 && (res.lines||res.bomb)) popup('COMBO ×'+res.mult,mid,mid+CELL*0.6,'#ff6ad5',CELL*0.75);
    if(res.perfect) popup('FLAWLESS +300',mid,mid+CELL*1.6,'#ffcf5a',CELL*0.8);
  }
  function afterMove(){
    render(); renderTray(); updateScore();
    if(game.over) setTimeout(showOver,550);
  }
  function showOver(){
    if(!game.over) return;
    $('#finalScore').textContent=game.score; $('#finalBest').textContent=best;
    $('#newBest').textContent = (game.score>0 && game.score>=best && game.score>startBest) ? '★ NEW BEST ★' : '';
    $('#over').classList.add('show');
  }
  let startBest=best;
  function restart(){
    $('#over').classList.remove('show'); clearing.clear(); startBest=best;
    game.reset(); lastScore=0; render(); renderTray(); updateScore();
  }

  slots.forEach(s=>s.addEventListener('pointerdown',startDrag));
  window.addEventListener('pointermove',moveDrag,{passive:true});
  window.addEventListener('pointerup',e=>endDrag(e,false));
  window.addEventListener('pointercancel',e=>endDrag(e,true));
  window.addEventListener('resize',()=>{layout();render();});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{ if(e.key==='r'||e.key==='R') restart(); });
  $('#restartBtn').addEventListener('click',restart);
  $('#againBtn').addEventListener('click',restart);
  window.__ui={render,renderTray,updateScore,restart,cellEls,get CELL(){return CELL;},get GAP(){return GAP;},get PAD(){return PAD;}};

  layout(); render(); updateScore();
})();
</script>
</body>
</html>
